<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Meu Ponto</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --panel: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --primary: #0f172a;
        --accent: #dbeafe;
        --success: #166534;
        --warning: #b45309;
        --danger: #b91c1c;
        --border: #e2e8f0;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      .app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .brand {
        font-size: 1.5rem;
        font-weight: 700;
      }

      .nav-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }

      .hero {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 18px;
      }

      .date-head {
        font-size: clamp(1.5rem, 3vw, 2.3rem);
        margin: 0 0 10px;
      }

      .status-line {
        color: var(--muted);
        margin: 8px 0 16px;
      }

      .record-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .record-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }

      .record-row small {
        color: var(--muted);
      }

      .punch-area {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 180px;
      }

      .big-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: min(100%, 340px);
        padding: 20px 18px;
        border-radius: 18px;
        background: var(--primary);
        color: #fff;
        font-size: 1.15rem;
        font-weight: 800;
        border: none;
        cursor: pointer;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .metric {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 6px;
      }

      .metric-value {
        font-weight: 800;
      }

      .calendar-wrap {
        margin-top: 24px;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }

      .dow {
        text-align: center;
        color: var(--muted);
        padding: 8px 0;
        font-size: 0.8rem;
      }

      .day-cell {
        min-height: 88px;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        cursor: pointer;
      }

      .day-cell.empty {
        background: transparent;
        border: 1px dashed transparent;
        cursor: default;
      }

      .day-number {
        font-weight: 700;
        font-size: 0.95rem;
      }

      .day-tag {
        font-size: 0.7rem;
        border-radius: 999px;
        padding: 3px 6px;
        display: inline-flex;
        align-self: flex-start;
      }

      .status-ok { background: #dcfce7; color: #166534; }
      .status-warn { background: #fef3c7; color: #b45309; }
      .status-danger { background: #fee2e2; color: #b91c1c; }
      .status-off { background: #e2e8f0; color: #334155; }
      .status-holiday { background: #dbeafe; color: #1d4ed8; }

      .history-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .history-table th, .history-table td {
        border-bottom: 1px solid var(--border);
        padding: 10px 8px;
        text-align: left;
      }

      .row-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .hidden { display: none !important; }

      .settings-grid {
        display: grid;
        gap: 12px;
      }

      @media (max-width: 768px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .meta-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media print {
        body { background: white; }
        .topbar, .nav-actions, .calendar-wrap, .history-table, .settings-grid, .punch-area { display: none !important; }
        .app { max-width: 100%; padding: 0; }
        .card { box-shadow: none; border: 0; }
        .sheet-print { display: block !important; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">Meu Ponto</div>
        <div class="nav-actions">
          <button class="btn" id="prevMonthBtn">Mês anterior</button>
          <button class="btn" id="currentMonthBtn">Mês atual</button>
          <button class="btn" id="nextMonthBtn">Próximo</button>
          <button class="btn primary" id="printBtn">Gerar PDF</button>
        </div>
      </div>

      <section class="card hero">
        <div>
          <h1 class="date-head" id="dateHeadline">Carregando...</h1>
          <div class="status-line" id="statusLine">Aguarde...</div>
          <div class="record-list" id="recordList"></div>
        </div>

        <div class="punch-area">
          <button class="big-btn" id="actionButton">Registrar</button>
        </div>
      </section>

      <section class="meta-grid">
        <div class="metric">
          <div class="metric-label">Jornada prevista</div>
          <div class="metric-value" id="plannedHours">--</div>
        </div>
        <div class="metric">
          <div class="metric-label">Horas trabalhadas</div>
          <div class="metric-value" id="workedHours">--</div>
        </div>
        <div class="metric">
          <div class="metric-label">Saldo diário</div>
          <div class="metric-value" id="dailyBalance">--</div>
        </div>
        <div class="metric">
          <div class="metric-label">Status</div>
          <div class="metric-value" id="statusText">--</div>
        </div>
      </section>

      <section class="calendar-wrap card">
        <div id="calendar"></div>
      </section>

      <section class="card" style="margin-top: 24px;">
        <h2>Histórico mensal</h2>
        <div id="historyTableWrap"></div>
      </section>

      <section class="card" style="margin-top: 24px;">
        <h2>Configuração</h2>
        <div class="settings-grid">
          <input type="text" id="nomeInput" placeholder="Nome completo" />
          <input type="text" id="empresaInput" placeholder="Empresa" />
          <input type="text" id="cargoInput" placeholder="Cargo" />
          <input type="time" id="entradaPadrao" />
          <input type="time" id="saidaPadrao" />
          <input type="number" id="intervaloInput" placeholder="Intervalo em minutos" />
          <button class="btn primary" id="saveConfigBtn">Salvar configurações</button>
        </div>
      </section>
    </div>

    <script>
      const state = {
        baseDate: new Date(),
        config: {},
        schedule: {},
        holidays: {},
        monthData: null
      };

      function getActionLabel(action) {
        const map = {
          ENTRADA: 'Registrar entrada',
          SAIDA_CAFE: 'Sair para café',
          VOLTA_CAFE: 'Voltar do café',
          SAIDA: 'Registrar saída',
          FINALIZADO: 'Ponto finalizado',
          FOLGA: 'Folga',
          FERIADO: 'Feriado'
        };
        return map[action] || 'Registrar';
      }

      function formatDate(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}/${month}/${year}`;
      }

      function renderRecordList(day) {
        const records = [
          { key: 'entrada', label: 'Entrada', value: day.entradas.entrada },
          { key: 'saidaCafe', label: 'Saída para café', value: day.entradas.saidaCafe },
          { key: 'voltaCafe', label: 'Volta do café', value: day.entradas.voltaCafe },
          { key: 'saida', label: 'Saída', value: day.entradas.saida }
        ];

        const container = document.getElementById('recordList');
        container.innerHTML = records.map((record) => `
          <div class="record-row">
            <div>
              <div>${record.label}</div>
              <small>${record.value ? record.value : 'Não registrado'}</small>
            </div>
            <div>${record.value ? '✓' : '—'}</div>
          </div>
        `).join('');
      }

      function renderHero(day) {
        document.getElementById('dateHeadline').textContent = `${day.weekday}, ${day.dataDisplay}`;
        document.getElementById('statusLine').textContent = day.available ? 'Jornada definida' : 'Folga ou feriado';
        document.getElementById('plannedHours').textContent = `${day.predictedMinutes ? (day.predictedMinutes / 60).toFixed(2).replace('.', ':') + 'h' : '0:00'}`;
        document.getElementById('workedHours').textContent = day.hoursWorked || '0:00';
        document.getElementById('dailyBalance').textContent = day.saldoText || '0:00';
        document.getElementById('statusText').textContent = day.nextAction || 'Pendente';
        document.getElementById('actionButton').textContent = getActionLabel(day.nextAction);
        renderRecordList(day);
      }

      function renderCalendar(monthData) {
        const calendarRoot = document.getElementById('calendar');
        const weekdayNames = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
        const grid = ['<div class="calendar-grid">'];

        weekdayNames.forEach((dayName) => {
          grid.push(`<div class="dow">${dayName}</div>`);
        });

        (monthData.calendar || []).forEach((day) => {
          if (!day) {
            grid.push('<div class="day-cell empty"></div>');
            return;
          }

          let badgeClass = 'status-off';
          let badgeText = 'Folga';
          if (day.holiday && !day.holiday.trabalha) {
            badgeClass = 'status-holiday';
            badgeText = 'Feriado';
          } else if (day.nextAction === 'FINALIZADO') {
            badgeClass = 'status-ok';
            badgeText = 'Completo';
          } else if (day.available && day.nextAction !== 'FOLGA') {
            badgeClass = 'status-warn';
            badgeText = 'Incompleto';
          } else if (!day.available) {
            badgeClass = 'status-off';
            badgeText = 'Folga';
          }

          grid.push(`
            <div class="day-cell" data-date="${day.dateKey}">
              <div class="day-number">${new Date(day.dateKey + 'T12:00:00').getDate()}</div>
              <span class="day-tag ${badgeClass}">${badgeText}</span>
            </div>
          `);
        });

        grid.push('</div>');
        calendarRoot.innerHTML = grid.join('');

        document.querySelectorAll('.day-cell[data-date]').forEach((cell) => {
          cell.addEventListener('click', () => {
            const targetKey = cell.dataset.date;
            const monthDataList = monthData.calendar.flatMap((item) => item ? [item] : []);
            const match = monthDataList.find((item) => item.dateKey === targetKey);
            if (match) {
              state.baseDate = new Date(match.dateKey + 'T12:00:00');
              renderApp();
            }
          });
        });
      }

      function renderHistory(monthData) {
        const historyWrap = document.getElementById('historyTableWrap');
        const rows = monthData.calendar.filter(Boolean);

        if (!rows.length) {
          historyWrap.innerHTML = '<p>Sem registros no mês.</p>';
          return;
        }

        const t = rows.map((day) => `
          <tr>
            <td>${day.dataDisplay}</td>
            <td>${day.entradas.entrada || '—'}</td>
            <td>${day.entradas.saidaCafe || '—'}</td>
            <td>${day.entradas.voltaCafe || '—'}</td>
            <td>${day.entradas.saida || '—'}</td>
            <td>${day.hoursWorked || '0:00'}</td>
            <td>${day.nextAction === 'FINALIZADO' ? 'Completo' : day.nextAction}</td>
          </tr>
        `).join('');

        historyWrap.innerHTML = `
          <table class="history-table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Entrada</th>
                <th>Café</th>
                <th>Volta</th>
                <th>Saída</th>
                <th>Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>${t}</tbody>
          </table>
        `;
      }

      function renderApp() {
        const day = state.monthData ? state.monthData.calendar.find((item) => item && item.dateKey === formatDate(state.baseDate).split('/').reverse().join('-')) || state.monthData.today : state.monthData.today;
        if (!state.monthData) {
          return;
        }

        const currentDate = new Date(state.baseDate.getFullYear(), state.baseDate.getMonth(), 1);
        const monthKey = currentDate.getFullYear() + '-' + String(currentDate.getMonth() + 1).padStart(2, '0');

        const safeDay = state.monthData.calendar.find((item) => item && item.dateKey === `${state.baseDate.getFullYear()}-${String(state.baseDate.getMonth()+1).padStart(2,'0')}-${String(state.baseDate.getDate()).padStart(2,'0')}`) || state.monthData.today;
        renderHero(safeDay);
        renderCalendar(state.monthData);
        renderHistory(state.monthData);

        document.getElementById('statusLine').textContent = `Mês: ${state.monthData.monthName} ${state.monthData.year} | Saldo: ${state.monthData.summary.saldo}`;

        document.getElementById('actionButton').onclick = function () {
          const nextAction = safeDay.nextAction;
          if (nextAction === 'FOLGA' || nextAction === 'FERIADO') {
            return;
          }
          const map = {
            ENTRADA: 'entrada',
            SAIDA_CAFE: 'saidaCafe',
            VOLTA_CAFE: 'voltaCafe',
            SAIDA: 'saida'
          };
          google.script.run.withSuccessHandler((result) => {
            state.monthData = result;
            renderApp();
          }).registerPunchEndpoint(map[nextAction]);
        };
      }

      function loadCurrentMonth(offset = 0) {
        const target = new Date(state.baseDate.getFullYear(), state.baseDate.getMonth() + offset, 1);
        state.baseDate = target;
        google.script.run.withSuccessHandler((result) => {
          state.monthData = result;
          renderApp();
        }).getCalendarData(target.getFullYear(), target.getMonth());
      }

      document.getElementById('prevMonthBtn').addEventListener('click', () => loadCurrentMonth(-1));
      document.getElementById('nextMonthBtn').addEventListener('click', () => loadCurrentMonth(1));
      document.getElementById('currentMonthBtn').addEventListener('click', () => {
        state.baseDate = new Date();
        loadCurrentMonth(0);
      });
      document.getElementById('printBtn').addEventListener('click', () => window.print());

      document.getElementById('saveConfigBtn').addEventListener('click', () => {
        const payload = {
          nome: document.getElementById('nomeInput').value,
          empresa: document.getElementById('empresaInput').value,
          cargo: document.getElementById('cargoInput').value,
          horarioPadrao: document.getElementById('entradaPadrao').value,
          intervaloPadrao: Number(document.getElementById('intervaloInput').value || 0)
        };
        google.script.run.withSuccessHandler((result) => {
          state.config = result;
          alert('Configurações salvas.');
        }).saveConfigEndpoint(payload);
      });

      google.script.run.withSuccessHandler((result) => {
        state.config = result.config || {};
        state.schedule = result.schedule || {};
        state.holidays = result.holidays || {};
        state.monthData = result;
        document.getElementById('nomeInput').value = state.config.nome || '';
        document.getElementById('empresaInput').value = state.config.empresa || '';
        document.getElementById('cargoInput').value = state.config.cargo || '';
        renderApp();
      }).getAppShell();
    </script>
  </body>
</html>
